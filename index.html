/* ── 유틸 ── */
function esc(v){
  if (v === null || v === undefined) return '';
  if (Array.isArray(v)) v = v.join(', ');
  else if (typeof v === 'object') { try { v = JSON.stringify(v); } catch(e){ v = ''; } }
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function br(v){ return esc(v).replace(/\n/g,'<br>'); }
function T(k){ var v = S.text[k]; return (v === undefined || v === null) ? (DEFAULT_TEXT[k] || '') : v; }
function pad2(n){ return String(n).padStart(2,'0'); }

}

/* ── 메인 ── */
function collectionHTML(id, items){
  if (!items.length) return '<div class="wu-empty">'+esc(T('empty-collection'))+'</div>';
  var loop = items.length > 1 ? items.concat(items, items) : items;
  var cards = loop.map(function(it, i){
    var idx = i % items.length;
    var cycle = items.length > 1 ? Math.floor(i / items.length) : 1;
    return '<figure class="look-card"'+(cycle!==1?' aria-hidden="true"':'')+'>'+
      '<img src="'+esc(it.image_url)+'" alt="'+(cycle===1?esc(it.label):'')+'" loading="lazy" referrerpolicy="no-referrer">'+
      '<figcaption><span>'+esc(T('look-prefix'))+' '+pad2(idx+1)+'</span>'+esc(it.label)+'</figcaption></figure>';
  }).join('');
  return '<div class="collection-wrap">'+
    '<div class="collection-row" id="'+id+'" data-loop="'+(items.length>1?1:0)+'" data-len="'+items.length+'">'+cards+'</div>'+
    '<button class="scroll-prev" type="button" data-scroll="'+id+'" data-dir="-1" aria-label="이전 이미지 보기"><span aria-hidden="true"></span></button>'+
    '<button class="scroll-next" type="button" data-scroll="'+id+'" data-dir="1" aria-label="다음 이미지 보기"><span aria-hidden="true"></span></button>'+
    '</div>';
}

function pledgeHTML(){

  var cur = Math.max(0, Math.min(Number(String(T('pledge-current')).replace(/[^0-9.]/g,'')) || 0, max));
  var pct = max ? Math.min(100, cur / max * 100) : 0;

  for (var i=0;i<list.length;i++){ if (Number(list[i].value||0) > cur) { next = list[i]; break; } }
  var done = list.filter(function(p){ return Number(p.value||0) <= cur; }).length;

      '<span class="pledge-index">'+pad2(i+1)+'</span>'+
      '<strong>'+esc(p.amount_label)+'</strong>'+

    '</article>';

      '<h1>'+esc(T('pledge-title'))+'</h1><span>'+esc(T('pledge-note'))+'</span></header>'+
    (list.length ? '<div class="pledge-progress-panel">'+
      '<div class="pledge-progress-top">'+
        '<span>'+esc(T('pledge-cur-label'))+' <strong>'+nf.format(cur)+esc(T('pledge-unit'))+'</strong></span>'+

/* ── 컬렉션 무한 루프 스크롤 ── */
function segWidth(row){
  var card = row.querySelector('.look-card');
  if (!card) return 0;
  var gap = parseFloat(getComputedStyle(row).columnGap) || 0;
  return (card.getBoundingClientRect().width + gap) * (Number(row.dataset.len) || 1);
}
/* 무한 회전이 양쪽 다 되려면 "전체 폭 - 보이는 폭 >= 한 세트 폭 x 2" 여야 한다.
   항목이 적으면 한 세트가 화면보다 좁아서 오른쪽 래핑 기준에 못 닿고 끝에서 멈춘다.
   → 화면 폭을 보고 필요한 만큼 세트를 더 복제해 둔다. */
function ensureCopies(row){
  var len = Number(row.dataset.len) || 1;
  var w = 0;
  for (var pass = 0; pass < 4; pass++){
    w = segWidth(row);
    if (!w) return 0;
    var need = Math.ceil(row.clientWidth / w) + 2;
    var have = Math.round(row.children.length / len);
    if (need <= have) break;
    var base = Array.prototype.slice.call(row.children, 0, len);
    for (var c = have; c < need; c++){
      base.forEach(function(node){
        var clone = node.cloneNode(true);
        clone.setAttribute('aria-hidden', 'true');
        var img = clone.querySelector('img');
        if (img) img.alt = '';
        row.appendChild(clone);
      });
    }
  }
  return w;
}

function initCollections(){
  document.querySelectorAll('.collection-row').forEach(function(row){
    if (row.dataset.loop !== '1') return;
    requestAnimationFrame(function(){
      var w = ensureCopies(row);
      if (w) row.scrollLeft = w;
    });
    var t = null;
    row.addEventListener('scroll', function(){
      clearTimeout(t);
      t = setTimeout(function(){
        var w = segWidth(row);
        if (!w) return;
        if (row.scrollLeft < w - 1) row.scrollLeft += w;
        else if (row.scrollLeft >= w * 2 - 1) row.scrollLeft -= w;
      }, 140);
    }, { passive:true });
  });
}

/* 창 크기가 바뀌면 필요한 세트 수도 달라진다 */
var _rzT = null;
window.addEventListener('resize', function(){
  clearTimeout(_rzT);
  _rzT = setTimeout(function(){
    document.querySelectorAll('.collection-row').forEach(function(row){
      if (row.dataset.loop !== '1') return;
      var w = ensureCopies(row);
      if (w && row.scrollLeft < w) row.scrollLeft = w;
    });
  }, 200);
});

function lbCaption(img){
  var fig = img.closest('figure');
  if (fig){
    var cap = fig.querySelector('figcaption');

      var kicker = cap.querySelector('span');
      var text = cap.textContent || '';

    }
  }
  var li = img.closest('li');
  if (li && li.querySelector('p')) return li.querySelector('p').textContent.trim();
  return img.getAttribute('alt') || '';
}

function lbOpen(img){

/* =============================================================
   DB 배선 — 저장한 값이 이 화면에 그대로 반영된다
   ============================================================= */
function num(v){ return Number(v) || 0; }

async function load(){
  try {
    if (!dbReady()) return;

    var p = await fetchProfile();
    if (p && typeof p === 'object'){
      /* '' 도 그대로 반영해야 admin에서 칸을 비웠을 때 실제로 숨겨진다 */
      Object.keys(DEFAULT_TEXT).forEach(function(k){
        if (p[k] !== undefined && p[k] !== null) S.text[k] = p[k];
      });
      paintTheme(p);
    }

    var res = await Promise.all([
      fetchAll('collection_items', { order:'sort_order' }),
      fetchAll('pledges',          { order:'sort_order' }),
      fetchAll('personal_rewards', { order:'sort_order' }),
      fetchAll('cumulative_tiers', { order:'sort_order' }),
      fetchAll('cumulative_items', { order:'sort_order' }),
      fetchAll('top_rewards',      { order:'sort_order' }),
      fetchAll('roulette_odds',    { order:'sort_order' }),
      fetchAll('reward_records',   { order:'sort_order' })
    ]);

    /* null = 못 읽음(기본값 유지) / [] = 진짜 비어 있음(빈 상태 표시) */
    var coll = res[0];
    if (coll){
      S.outfits = coll.filter(function(r){ return r.category === 'outfit'; });
      S.hair    = coll.filter(function(r){ return r.category === 'hair'; });
    }
    if (res[1]) S.pledges  = res[1].map(function(r){ return { amount_label:r.amount_label, value:num(r.value), reward:r.reward }; });
    if (res[2]) S.personal = res[2];
    if (res[3]){
      var items = res[4] || [];
      S.tiers = res[3].map(function(t){
        return { amount_label: t.amount_label,
                 items: items.filter(function(it){ return String(it.tier_id) === String(t.id); }) };
      });
    }
    if (res[5]) S.top      = res[5];
    if (res[6]) S.roulette = res[6];
    S.records = res[7] || [];
  } catch(e){
    console.error('load 실패 — 기본값으로 표시합니다.', e);
  }
}
