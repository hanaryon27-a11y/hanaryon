/* 보상기록 계열 두 화면의 설정 — 데이터·문구 접두어만 다르고 생김새는 같다 */
var SECS = {
  records: { pfx:'rec', get:function(){ return S.records; } },
  log:     { pfx:'log', get:function(){ return S.logs; } }
};
var GRP = { records: [], log: [] };
var view = 'main';

/* ── 유틸 ── */
function esc(v){
  if (v === null || v === undefined) return '';
  if (Array.isArray(v)) v = v.join(', ');
  else if (typeof v === 'object') { try { v = JSON.stringify(v); } catch(e){ v = ''; } }
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function br(v){ return esc(v).replace(/\n/g,'<br>'); }
function T(k){ var v = S.text[k]; return (v === undefined || v === null) ? (DEFAULT_TEXT[k] || '') : v; }
function pad2(n){ return String(n).padStart(2,'0'); }
var nf = new Intl.NumberFormat('ko-KR');

/* ── 사이드 목차 ── */
function renderNav(){
  var n = document.getElementById('navList');
  n.innerHTML = NAV_ORDER.map(function(k){
    return '<button type="button" id="nav-'+k+'" data-key="'+k+'"'+(view===k?' class="active" aria-current="page"':'')+'>'+
           '<small>'+esc(T('nav-'+k+'-en'))+'</small><span>'+esc(T('nav-'+k+'-ko'))+'</span></button>';
  }).join('');
}

/* ── 메인 ── */
function collectionHTML(id, items){
  if (!items.length) return '<div class="wu-empty">'+esc(T('empty-collection'))+'</div>';
  var loop = items.length > 1 ? items.concat(items, items) : items;
  var cards = loop.map(function(it, i){
    var idx = i % items.length;
    var cycle = items.length > 1 ? Math.floor(i / items.length) : 1;
    return '<figure class="look-card"'+(cycle!==1?' aria-hidden="true"':'')+'>'+
      '<img src="'+esc(it.image_url)+'" alt="'+(cycle===1?esc(it.label):'')+'" loading="lazy" referrerpolicy="no-referrer">'+
      '<figcaption><span>'+esc(T('look-prefix'))+' '+pad2(idx+1)+'</span>'+esc(it.label)+'</figcaption></figure>';
  }).join('');
  return '<div class="collection-wrap">'+
    '<div class="collection-row" id="'+id+'" data-loop="'+(items.length>1?1:0)+'" data-len="'+items.length+'">'+cards+'</div>'+
    '<button class="scroll-prev" type="button" data-scroll="'+id+'" data-dir="-1" aria-label="이전 이미지 보기"><span aria-hidden="true"></span></button>'+
    '<button class="scroll-next" type="button" data-scroll="'+id+'" data-dir="1" aria-label="다음 이미지 보기"><span aria-hidden="true"></span></button>'+
    '</div>';
}

function mainHTML(){
  var perCol = Math.max(1, parseInt(T('roulette-percol'), 10) || 5);
  var cols = [];
  for (var ci = 0; ci < S.roulette.length; ci += perCol) cols.push(S.roulette.slice(ci, ci + perCol));
  var colHTML = cols.map(function(col){
    return '<div class="roulette-column">'+col.map(function(r){
      return '<div class="roulette-row"><span>'+esc(r.label)+'</span><strong>'+esc(r.chance)+'</strong></div>';
    }).join('')+'</div>';
  }).join('');

  return '<div class="main-view">'+
    '<section class="collection-section" aria-labelledby="outfit-title">'+
      '<div class="section-title"><p>'+esc(T('outfit-kicker'))+'</p>'+
      '<h2 id="outfit-title">'+esc(T('outfit-title'))+'</h2></div>'+
      collectionHTML('outfit-row', S.outfits)+
    '</section>'+
    '<section class="collection-section" aria-labelledby="hair-title">'+
      '<div class="section-title"><p>'+esc(T('hair-kicker'))+'</p>'+
      '<h2 id="hair-title">'+esc(T('hair-title'))+'</h2></div>'+
      collectionHTML('hair-row', S.hair)+
    '</section>'+
    '<section class="roulette-section" aria-labelledby="roulette-title">'+
      '<div class="section-title roulette-heading"><div><p>'+esc(T('roulette-kicker'))+'</p>'+
      '<h2 id="roulette-title">'+esc(T('roulette-title'))+'</h2></div>'+
      (T('roulette-badge') ? '<span class="sample-badge">'+esc(T('roulette-badge'))+'</span>' : '')+'</div>'+
      '<div class="roulette-card">'+
        '<div class="roulette-wheel" aria-hidden="true">'+
          '<img class="roulette-mascot" src="'+esc(T('roulette-mascot'))+'" alt="" referrerpolicy="no-referrer">'+
        '</div>'+
        '<div class="roulette-list">'+
          (S.roulette.length ? '<div class="roulette-columns" style="grid-template-columns:repeat('+Math.max(1,cols.length)+',minmax(0,1fr))">'+colHTML+'</div>'
                             : '<div class="wu-empty">'+esc(T('empty-roulette'))+'</div>')+
          (T('roulette-note') ? '<small>'+esc(T('roulette-note'))+'</small>' : '')+
        '</div>'+
      '</div>'+
    '</section>'+
  '</div>';
}

/* ── 누적공약 ── */
function pledgeHTML(){
  var list = S.pledges;
  var max = list.length ? Number(list[list.length-1].value || 0) : 0;
  var cur = Math.max(0, Math.min(Number(String(T('pledge-current')).replace(/[^0-9.]/g,'')) || 0, max));
  var pct = max ? Math.min(100, cur / max * 100) : 0;
  var next = null;
  for (var i=0;i<list.length;i++){ if (Number(list[i].value||0) > cur) { next = list[i]; break; } }
  var done = list.filter(function(p){ return Number(p.value||0) <= cur; }).length;

  var rows = list.length ? list.map(function(p, i){
    var v = Number(p.value||0);
    var ach = cur >= v;
    var isNext = next && Number(next.value||0) === v;
    return '<article class="pledge-row'+(ach?' achieved':'')+(isNext?' current':'')+'">'+
      '<span class="pledge-index">'+pad2(i+1)+'</span>'+
      '<strong>'+esc(p.amount_label)+'</strong>'+
      '<p>'+esc(p.reward)+'</p>'+
      '<span class="pledge-status">'+esc(ach?T('pledge-st-done'):(isNext?T('pledge-st-next'):T('pledge-st-wait')))+'</span>'+
    '</article>';
  }).join('') : '<div class="wu-empty">'+esc(T('empty-pledge'))+'</div>';

  return '<section class="reward-view pledge-view">'+
    '<header class="reward-header"><p>'+esc(T('pledge-kicker'))+'</p>'+
      '<h1>'+esc(T('pledge-title'))+'</h1><span>'+esc(T('pledge-note'))+'</span></header>'+
    (list.length ? '<div class="pledge-progress-panel">'+
      '<div class="pledge-progress-top">'+
        '<span>'+esc(T('pledge-cur-label'))+' <strong>'+nf.format(cur)+esc(T('pledge-unit'))+'</strong></span>'+
        '<strong>'+pct.toFixed(1)+'%</strong>'+
      '</div>'+
      '<div class="pledge-progress-track" role="progressbar" aria-label="누적공약 달성률" aria-valuemin="0" aria-valuemax="'+max+'" aria-valuenow="'+cur+'">'+
        '<span style="width:'+pct+'%"></span></div>'+
      '<div class="pledge-progress-bottom">'+
        '<span>'+esc(T('pledge-done-label'))+' <strong>'+done+'</strong> / '+list.length+'</span>'+
        '<span>'+(next ? esc(T('pledge-next-prefix'))+' '+esc(next.amount_label)+' · '+nf.format(Number(next.value||0)-cur)+esc(T('pledge-next-suffix'))
                       : esc(T('pledge-all-done')))+'</span>'+
      '</div>'+
    '</div>' : '')+
    '<div class="pledge-list">'+rows+'</div>'+
  '</section>';
}

/* ── 개인보상 ── */

    var items = t.items || [];
    var cards = items.length ? items.map(function(it){

    }).join('') : '';
    return '<section class="product-tier" aria-labelledby="'+id+'-title">'+
      '<h2 id="'+id+'-title">'+esc(t.amount_label)+'</h2>'+
      '<div class="product-gallery-wrap">'+
        (items.length ? '<div class="product-gallery" id="'+id+'">'+cards+'</div>'
                      : '<div class="wu-empty">'+esc(T('empty-tier'))+'</div>')+
        (items.length > 3
          ? '<button class="product-gallery-prev" type="button" data-scroll="'+id+'" data-dir="-1" aria-label="이전 보상 보기"><span aria-hidden="true"></span></button>'+
            '<button class="product-gallery-next" type="button" data-scroll="'+id+'" data-dir="1" aria-label="다음 보상 보기"><span aria-hidden="true"></span></button>'
          : '')+
      '</div></section>';
  }).join('') : '<div class="wu-empty">'+esc(T('empty-cumul'))+'</div>';

  return '<section class="reward-view cumulative-view">'+
    '<header class="reward-header"><p>'+esc(T('cumul-kicker'))+'</p>'+
      '<h1>'+esc(T('cumul-title'))+'</h1><span>'+esc(T('cumul-note'))+'</span></header>'+
    '<div class="product-tiers">'+tiers+'</div></section>';
}

/* ── TOP5 ── */
function topHTML(){
  var lis = S.top.length ? S.top.map(function(r, i){
    var head = r.image_url
      ? '<img class="top-reward-image" src="'+esc(r.image_url)+'" alt="" loading="lazy" referrerpolicy="no-referrer">'
      : '<span>'+pad2(i+1)+'</span>';
    return '<li>'+head+'<p>'+esc(r.label)+'</p></li>';
  }).join('') : '<li><span>--</span><p>'+esc(T('empty-top'))+'</p></li>';
  return '<section class="reward-view top-view">'+
    '<header class="reward-header"><p>'+esc(T('top-kicker'))+'</p>'+
      '<h1>'+esc(T('top-title'))+'</h1><span>'+esc(T('top-note'))+'</span></header>'+
    '<ol class="top-list">'+lis+'</ol></section>';
}

/* ── 보상기록 ── */
function recAvatarTag(id, cls){
  var av = (typeof soopAvatar === 'function') ? soopAvatar(id) : '';
  if (!av) return '';
  return '<img class="'+cls+'" src="'+esc(av)+'" alt="" loading="lazy" referrerpolicy="no-referrer"'+
         ' onerror="this.style.display=\'none\'">';
}
function stChip(st){
  st = String(st || '대기');
  var cls = st.indexOf('완료') > -1 ? 'done' : (st.indexOf('진행') > -1 ? 'ing' : 'wait');
  return '<i class="rec-chip '+cls+'" style="font-style:normal">'+esc(st)+'</i>';
}

/** 시청자 카드 격자 (검색어로 걸러서 그림) */
function recGridHTML(sec, q){
  var P = SECS[sec].pfx;
  q = String(q || '').trim().toLowerCase();
  var list = GRP[sec].map(function(g, gi){ return { g:g, gi:gi }; });
  if (q) list = list.filter(function(x){
    return String(x.g.nickname).toLowerCase().indexOf(q) > -1 ||
           String(x.g.soop_id).toLowerCase().indexOf(q) > -1;
  });
  if (!list.length) return '<div class="rec-none">'+esc(q ? T(P+'-nores') : T(P+'-empty-title'))+'</div>';

  return list.map(function(x){
    var g = x.g, s = recSummary(g.items);
    var ini = String(g.nickname || '?').charAt(0);
    var av = (typeof soopAvatar === 'function') ? soopAvatar(g.soop_id) : '';
    var face = av
      ? '<img class="rec-face" src="'+esc(av)+'" alt="" loading="lazy" referrerpolicy="no-referrer"'+
        ' onerror="this.className=\'rec-face-fb\';this.replaceWith(Object.assign(document.createElement(\'span\'),'+
        '{className:\'rec-face-fb\',textContent:\''+esc(ini)+'\'}))">'
      : '<span class="rec-face-fb">'+esc(ini)+'</span>';
    var allDone = s.total && s.done === s.total;
    return '<button class="rec-card'+(allDone?' cleared':'')+'" type="button" data-rec="'+sec+':'+x.gi+'"'+
           ' aria-label="'+esc(g.nickname)+' 보상 '+s.total+'건 자세히 보기">'+
      '<span class="rec-seal">'+String(x.gi+1).padStart(2,'0')+'</span>'+
      face+
      '<span class="rec-nick">'+esc(g.nickname)+'</span>'+
      '<span class="rec-id">'+(g.soop_id ? esc(g.soop_id) : '&nbsp;')+'</span>'+
      '<span class="rec-total">'+esc(T(P+'-badge'))+' '+s.total+esc(T(P+'-count-unit'))+'</span>'+
      '<span class="rec-prog"><i style="width:'+(s.total? (s.done/s.total*100):0)+'%"></i></span>'+
      '<span class="rec-progtx">'+esc(T(P+'-sum-label'))+' '+s.done+' / '+s.total+'</span>'+
    '</button>';
  }).join('');
}

function sectionHTML(sec){
  var P = SECS[sec].pfx;
  var cls = (sec === 'log') ? 'records-view log-view' : 'records-view';
  GRP[sec] = (typeof recGroups === 'function') ? recGroups(SECS[sec].get()) : [];
  var head = '<header class="reward-header"><p>'+esc(T(P+'-kicker'))+'</p>'+
    '<h1>'+esc(T(P+'-title'))+'</h1><span>'+esc(T(P+'-note'))+'</span></header>';

  if (!GRP[sec].length){
    return '<section class="reward-view '+cls+'">'+head+
      '<div class="records-table"><div class="records-empty"><strong>'+esc(T(P+'-empty-title'))+'</strong>'+
      '<p>'+esc(T(P+'-empty-desc'))+'</p></div></div></section>';
  }
  return '<section class="reward-view '+cls+'">'+head+
    '<div class="rec-bar">'+
      '<input class="rec-search" id="recSearch-'+sec+'" type="search" autocomplete="off" data-sec="'+sec+'"'+
        ' placeholder="'+esc(T(P+'-search-ph'))+'" aria-label="시청자 검색">'+
      '<span class="rec-tally">'+GRP[sec].length+'<small>名</small></span>'+
    '</div>'+
    '<div class="rec-grid" id="recGrid-'+sec+'">'+recGridHTML(sec,'')+'</div>'+
    (T(P+'-tap-hint') ? '<div class="rec-hint">'+esc(T(P+'-tap-hint'))+'</div>' : '')+
  '</section>';
}
function recordsHTML(){ return sectionHTML('records'); }
function logHTML(){ return sectionHTML('log'); }

/* ── 화면 그리기 ── */
var BUILD = { main:mainHTML, pledge:pledgeHTML, personal:personalHTML,
              cumulative:cumulativeHTML, top5:topHTML, records:recordsHTML, log:logHTML };

function render(){
  var panel = document.getElementById('panel');
  panel.className = 'content-panel content-panel-' + view;
  panel.setAttribute('aria-labelledby', 'nav-' + view);
  panel.innerHTML = (BUILD[view] || mainHTML)();
  renderNav();
  if (view === 'main') initCollections();
}

var reduceMotion = false;
try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}

function paintCover(avId, stampId, nameId, key){
  var av = document.getElementById(avId);
  var src = T('loader-image') || T('site-icon');
  if (av && src){ av.style.display = ''; av.src = src; }
  var st = document.getElementById(stampId);
  if (st){ st.style.display = src ? 'none' : 'grid'; st.textContent = T('brand-stamp'); }
  var nm = document.getElementById(nameId);
  if (nm) nm.textContent = T('trans-prefix') + T('nav-' + key + '-ko');
}

function applyView(k){
  view = k;
  try { history.replaceState(null, '', k === 'main' ? '#' : '#' + k); } catch(e){}
  render();
  window.scrollTo({ top:0, behavior:'auto' });
}

var switching = false;
function selectView(k){
  if (!BUILD[k]) k = 'main';
  if (k === view || switching) { if (k !== view) applyView(k); return; }
  if (reduceMotion){ applyView(k); return; }

  var cover = document.getElementById('wutrans');
  paintCover('transAv', 'transStamp', 'transName', k);
  switching = true;
  cover.classList.add('on');
  setTimeout(function(){ applyView(k); }, 250);
  setTimeout(function(){ cover.classList.remove('on'); switching = false; }, 540);
}

/* ── 컬렉션 무한 루프 스크롤 ── */
function segWidth(row){
  var card = row.querySelector('.look-card');
  if (!card) return 0;
  var gap = parseFloat(getComputedStyle(row).columnGap) || 0;
  return (card.getBoundingClientRect().width + gap) * (Number(row.dataset.len) || 1);
}
/* 무한 회전이 양쪽 다 되려면 "전체 폭 - 보이는 폭 >= 한 세트 폭 x 2" 여야 한다.
   항목이 적으면 한 세트가 화면보다 좁아서 오른쪽 래핑 기준에 못 닿고 끝에서 멈춘다.
   → 화면 폭을 보고 필요한 만큼 세트를 더 복제해 둔다. */
function ensureCopies(row){
  var len = Number(row.dataset.len) || 1;
  var w = 0;
  for (var pass = 0; pass < 4; pass++){
    w = segWidth(row);
    if (!w) return 0;
    var need = Math.ceil(row.clientWidth / w) + 2;
    var have = Math.round(row.children.length / len);
    if (need <= have) break;
    var base = Array.prototype.slice.call(row.children, 0, len);
    for (var c = have; c < need; c++){
      base.forEach(function(node){
        var clone = node.cloneNode(true);
        clone.setAttribute('aria-hidden', 'true');
        var img = clone.querySelector('img');
        if (img) img.alt = '';
        row.appendChild(clone);
      });
    }
  }
  return w;
}

function initCollections(){
  document.querySelectorAll('.collection-row').forEach(function(row){
    if (row.dataset.loop !== '1') return;
    requestAnimationFrame(function(){
      var w = ensureCopies(row);
      if (w) row.scrollLeft = w;
    });
    var t = null;
    row.addEventListener('scroll', function(){
      clearTimeout(t);
      t = setTimeout(function(){
        var w = segWidth(row);
        if (!w) return;
        if (row.scrollLeft < w - 1) row.scrollLeft += w;
        else if (row.scrollLeft >= w * 2 - 1) row.scrollLeft -= w;
      }, 140);
    }, { passive:true });
  });
}

/* 창 크기가 바뀌면 필요한 세트 수도 달라진다 */
var _rzT = null;
window.addEventListener('resize', function(){
  clearTimeout(_rzT);
  _rzT = setTimeout(function(){
    document.querySelectorAll('.collection-row').forEach(function(row){
      if (row.dataset.loop !== '1') return;
      var w = ensureCopies(row);
      if (w && row.scrollLeft < w) row.scrollLeft = w;
    });
  }, 200);
});

/* ── 좌우 화살표 ── */
document.addEventListener('click', function(e){
  var nav = e.target.closest('#navList button');
  if (nav){ selectView(nav.dataset.key); return; }

  var arrow = e.target.closest('[data-scroll]');
  if (arrow){
    var row = document.getElementById(arrow.dataset.scroll);
    if (!row) return;
    var dir = Number(arrow.dataset.dir) || 1;
    var step = row.classList.contains('collection-row')
      ? (segWidth(row) / (Number(row.dataset.len) || 1)) || 200
      : 320;
    row.scrollBy({ left: dir * step, behavior:'smooth' });
  }
});

/* ── 보상기록 상세 모달 ── */
var recBack = document.getElementById('recBack');

function recOpen(sec, gi){
  var P = SECS[sec] ? SECS[sec].pfx : 'rec';
  var g = (GRP[sec] || [])[gi];
  if (!g) return;
  document.getElementById('recAv').innerHTML = recAvatarTag(g.soop_id, 'rec-av-big');
  document.getElementById('recName').textContent = g.nickname;
  document.getElementById('recKicker').textContent = T(P+'-kicker');
  document.getElementById('recClose').textContent = T(P+'-close');
  var sm = recSummary(g.items);
  document.getElementById('recSum').innerHTML =
    '<span class="rec-prog"><i style="width:'+(sm.total? (sm.done/sm.total*100):0)+'%"></i></span>'+
    '<b>'+esc(T(P+'-sum-label'))+' '+sm.done+' / '+sm.total+'</b>';
  document.getElementById('recList').innerHTML = g.items.map(function(it, i){
    var done = String(it.status || '').indexOf('완료') > -1;
    return '<div class="rec-item'+(done?' done':'')+'">'+
      '<span class="rec-no">'+pad2(i+1)+'</span>'+
      '<p>'+esc(it.reward)+'</p>'+
      (done ? '<span class="rec-done">'+esc(T(P+'-done-note'))+'</span>' : stChip(it.status))+
    '</div>';
  }).join('');
  recBack.classList.add('on');
  document.body.style.overflow = 'hidden';
}
function recCloseFn(){
  recBack.classList.remove('on');
  document.body.style.overflow = '';
}
document.addEventListener('click', function(e){
  var card = e.target.closest('[data-rec]');
  if (card){
    var parts = String(card.dataset.rec).split(':');
    recOpen(parts[0], Number(parts[1]));
    return;
  }
  if (e.target.closest('#recClose') || e.target === recBack) recCloseFn();
});

/* 검색 — 입력할 때마다 해당 화면의 카드 격자만 다시 그림 */
document.addEventListener('input', function(e){
  var sec = e.target.dataset && e.target.dataset.sec;
  if (!sec || !SECS[sec]) return;
  var grid = document.getElementById('recGrid-' + sec);
  if (grid) grid.innerHTML = recGridHTML(sec, e.target.value);
});

/* ── 이미지 확대 ── */
var LB_SEL = '.look-card img, .product-card img, .top-reward-image';
var lb = document.getElementById('lightbox');
var lbImg = document.getElementById('lbImg');
var lbCap = document.getElementById('lbCap');

function lbCaption(img){
  var fig = img.closest('figure');
  if (fig){
    var cap = fig.querySelector('figcaption');
    if (cap){
      var kicker = cap.querySelector('span');
      var text = cap.textContent || '';
      if (kicker) text = text.replace(kicker.textContent, '').trim();
      return text.trim();
    }
  }
  var li = img.closest('li');
  if (li && li.querySelector('p')) return li.querySelector('p').textContent.trim();
  return img.getAttribute('alt') || '';
}

function lbOpen(img){
  var src = img.getAttribute('src');
  if (!src) return;
  lbImg.src = src;
  lbImg.alt = lbCaption(img);
  var cap = lbCaption(img);
  lbCap.textContent = cap;
  lbCap.style.display = cap ? '' : 'none';
  lb.classList.add('on');
  document.body.style.overflow = 'hidden';
}
function lbClose(){
  lb.classList.remove('on');
  document.body.style.overflow = '';
  lbImg.removeAttribute('src');
}

document.addEventListener('click', function(e){
  var img = e.target.closest(LB_SEL);
  if (img && !lb.classList.contains('on')){ lbOpen(img); return; }
  if (e.target.closest('#lbClose') || e.target === lb){ lbClose(); }
});
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (lb.classList.contains('on')) lbClose();
  else if (recBack.classList.contains('on')) recCloseFn();
});

/* ── 다크(야간 등화관제) ── */
function paintKnob(){
  document.getElementById('darkKnob').textContent = document.body.classList.contains('dark') ? '☾' : '☀';
}
document.getElementById('darkBtn').addEventListener('click', function(){
  var on = document.body.classList.toggle('dark');
  try { localStorage.setItem('theme', on ? 'dark' : 'light'); } catch(e){}
  paintKnob();
});
paintKnob();

/* ── 문의 모달 ── */
var askBack = document.getElementById('askBack');
function askOpen(){ askBack.classList.add('on'); document.getElementById('askMsg').focus(); }
function askClose(){ askBack.classList.remove('on'); }
document.getElementById('askOpen').addEventListener('click', askOpen);
document.getElementById('askClose').addEventListener('click', askClose);
askBack.addEventListener('click', function(e){ if (e.target === askBack) askClose(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !lb.classList.contains('on') && !recBack.classList.contains('on')) askClose();
});
document.getElementById('askSend').addEventListener('click', async function(){
  var msg = document.getElementById('askMsg').value.trim();
  var nick = document.getElementById('askNick').value.trim();
  if (!msg){ showToast(T('ask-need')); return; }
  this.disabled = true;
  var ok = false;
  try { ok = await insertRow('inquiries', { nickname: nick || null, message: msg }); } catch(e){}
  this.disabled = false;
  if (ok){
    document.getElementById('askMsg').value = '';
    document.getElementById('askNick').value = '';
    askClose();
    showToast(T('ask-done'));
  } else {
    showToast(T('ask-fail'));
  }
});

/* =============================================================
   DB 배선 — 저장한 값이 이 화면에 그대로 반영된다
   ============================================================= */
function num(v){ return Number(v) || 0; }

async function load(){
  try {
    if (!dbReady()) return;

    var p = await fetchProfile();
    if (p && typeof p === 'object'){
      /* '' 도 그대로 반영해야 admin에서 칸을 비웠을 때 실제로 숨겨진다 */
      Object.keys(DEFAULT_TEXT).forEach(function(k){
        if (p[k] !== undefined && p[k] !== null) S.text[k] = p[k];
      });
      paintTheme(p);
    }

    var res = await Promise.all([
      fetchAll('collection_items', { order:'sort_order' }),
      fetchAll('pledges',          { order:'sort_order' }),
      fetchAll('personal_rewards', { order:'sort_order' }),
      fetchAll('cumulative_tiers', { order:'sort_order' }),
      fetchAll('cumulative_items', { order:'sort_order' }),
      fetchAll('top_rewards',      { order:'sort_order' }),
      fetchAll('roulette_odds',    { order:'sort_order' }),
      fetchAll('reward_records',   { order:'sort_order' }),
      fetchAll('reward_log',       { order:'sort_order' })
    ]);

    /* null = 못 읽음(기본값 유지) / [] = 진짜 비어 있음(빈 상태 표시) */
    var coll = res[0];
    if (coll){
      S.outfits = coll.filter(function(r){ return r.category === 'outfit'; });
      S.hair    = coll.filter(function(r){ return r.category === 'hair'; });
    }
    if (res[1]) S.pledges  = res[1].map(function(r){ return { amount_label:r.amount_label, value:num(r.value), reward:r.reward }; });
    if (res[2]) S.personal = res[2];
    if (res[3]){
      var items = res[4] || [];
      S.tiers = res[3].map(function(t){
        return { amount_label: t.amount_label,
                 items: items.filter(function(it){ return String(it.tier_id) === String(t.id); }) };
      });
    }
    if (res[5]) S.top      = res[5];
    if (res[6]) S.roulette = res[6];
    S.records = res[7] || [];
    S.logs    = res[8] || [];
  } catch(e){
    console.error('load 실패 — 기본값으로 표시합니다.', e);
  }
}

/* ── 문구 반영 (제목 · 설명 · 플레이스홀더 · 인장 · 도장 글자) ── */
/* 글자 크기 (8~48px 사이만 허용, 벗어나면 기본값) */
function setFs(cssVar, key, def){
  var n = parseFloat(String(T(key)).replace(/[^0-9.]/g, ''));
  if (!n || n < 8 || n > 48) n = def;
  document.documentElement.style.setProperty(cssVar, n + 'px');
}

function applyStrings(){
  document.title = T('site-title');
  setFs('--fs-pledge-label',   'pledge-fs-label',   14);
  setFs('--fs-pledge-text',    'pledge-fs-text',    12);
  setFs('--fs-personal-label', 'personal-fs-label', 20);
  setFs('--fs-personal-text',  'personal-fs-text',  13);
  var md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute('content', T('site-desc'));
  var og = document.querySelector('meta[property="og:title"]');
  if (og) og.setAttribute('content', T('site-title'));
  var ogd = document.querySelector('meta[property="og:description"]');
  if (ogd) ogd.setAttribute('content', T('site-desc'));
  var ic = document.getElementById('siteIcon');
  if (ic && T('site-icon')) ic.setAttribute('href', T('site-icon'));
  document.getElementById('askNick').placeholder = T('ask-nick-ph');
  document.getElementById('askMsg').placeholder  = T('ask-msg-ph');
  paintCover('loadAv', 'loadStamp', 'loadName', view);
  document.documentElement.style.setProperty('--rec-glyph', '"' + String(T('rec-glyph')).replace(/"/g,'') + '"');
  document.documentElement.style.setProperty('--log-glyph', '"' + String(T('log-glyph')).replace(/"/g,'') + '"');
}

/* ── 시작 ── */
(async function boot(){
  try {
    var hash = (location.hash || '').slice(1);
    if (BUILD[hash]) view = hash;
  } catch(e){}
  paintCover('loadAv', 'loadStamp', 'loadName', view);
  render();
  await load();
  document.getElementById('sideNote').innerHTML = br(T('side-note'));
  document.querySelectorAll('[data-hook]').forEach(function(el){
    var v = S.text[el.dataset.hook];
    if (v !== undefined && v !== null) el.innerHTML = br(v);
  });
  applyStrings();
  render();
  document.body.classList.add('ready');
  if (window.fxHideLoader) window.fxHideLoader();
  try { enableIframeAutoHeight(); } catch(e){}
})();

window.addEventListener('hashchange', function(){
  var k = (location.hash || '').slice(1);
  if (BUILD[k] && k !== view) { view = k; render(); }
});

})();
